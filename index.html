  renderPersonPicker('addCreditPickerList', '', pickClientForManualCredit, createClientForManualCredit);
}
function pickClientForManualCredit(clientId){ return `openAddCreditAmount('${clientId}')`; }
function createClientForManualCredit(safeName){ return `promptNewCreditClient('${safeName}', 'manual')`; }

function openAddCreditAmount(clientId, newClientName, newClientPhone){
  const c = clientId ? state.credits.find(x=>x.id===clientId) : null;
  openModal(`
    <div class="modal-handle"></div>
    <h3>${c ? escapeHtml(c.name) : escapeHtml(newClientName)}</h3>
    <label>Montant du crédit (FCFA)</label>
    <input type="number" id="manualCreditAmt" placeholder="Ex: 2000">
    <label>Motif (optionnel)</label>
    <input type="text" id="manualCreditNote" placeholder="Ex: dette avant l'appli, marchandise...">
    <div style="position:sticky; bottom:-1px; background:var(--cream); padding:14px 0 2px; margin-top:4px;">
      <button class="btn btn-gold" onclick="saveManualCredit(${clientId?`'${clientId}'`:'null'}, ${newClientName?`'${escapeHtml(newClientName)}'`:'null'}, ${newClientPhone?`'${escapeHtml(newClientPhone)}'`:'null'})">Enregistrer</button>
    </div>
  `);
}

async function saveManualCredit(clientId, newClientName, newClientPhone){
  const amt = parseFloat(document.getElementById('manualCreditAmt').value);
  const note = document.getElementById('manualCreditNote').value.trim();
  if(isNaN(amt) || amt<=0){ toast('⚠️ Entre un montant valide'); return; }
  let c = clientId ? state.credits.find(x=>x.id===clientId) : null;
  if(!c){
    c = { id: uid(), name: newClientName, phone: newClientPhone||'', balance:0, history:[] };
    state.credits.push(c);
  }
  c.balance += amt;
  c.history.push({date: new Date().toISOString(), type:'vente', amount: amt, note: note || 'Crédit enregistré'});
  await saveData();
  render();
  toast('✅ Crédit enregistré pour ' + c.name);
  autoReportMovement(`Crédit ajouté : ${money(amt)} — ${c.name}`);
  openClientModal(c.id);
}

/** Ouvre une conversation WhatsApp avec ce client, message pré-rempli si un solde est dû. */
function messageClientWhatsApp(clientId){
  const cl = state.credits.find(x=>x.id===clientId);
  if(!cl || !cl.phone) return;
  const digits = cl.phone.replace(/[^0-9]/g, '');
  const co = state.company && state.company.name ? state.company.name : 'Caisse Simple';
  const text = cl.balance>0
    ? `Bonjour ${cl.name}, ici ${co}. Petit rappel : il vous reste ${money(cl.balance)} à régler. Merci !`
    : `Bonjour ${cl.name}, ici ${co}.`;
  window.open(`https://wa.me/${digits}?text=${encodeURIComponent(text)}`, '_blank');
}

function openClientModal(id){
  const c = state.credits.find(x=>x.id===id);
  const hist = c.history.map((h,i)=>({h,i})).reverse().map(({h,i})=>`
    <div class="ledger-row" onclick="openEditCreditHistory('${c.id}',${i})" style="cursor:pointer;">
      <div class="row-main">
        <div class="row-title">${h.type==='vente'?'Achat à crédit':'Paiement reçu'}</div>
        <div class="row-sub">${new Date(h.date).toLocaleDateString('fr-FR')}</div>
      </div>
      <div class="row-right">
        <span class="price" style="color:${h.type==='vente'?'var(--terracotta)':'var(--green)'}">${h.type==='vente'?'+':'−'}${money(h.amount)}</span>
      </div>
    </div>`).join('');
  openModal(`
    <div class="modal-handle"></div>
    <h3>${escapeHtml(c.name)}</h3>
    ${c.phone ? `<div class="row-sub" style="margin-bottom:10px;">📞 ${escapeHtml(c.phone)}</div>` : ''}
    <div class="summary-tile gold" style="margin-bottom:14px;">
      <div class="lbl">Solde dû</div>
      <div class="val">${money(c.balance)}</div>
    </div>

/**
 * Recalcule le solde d'un client à partir de son historique complet —
 * utilisé après modification/suppression d'un mouvement, pour éviter
 * toute dérive entre le solde affiché et les mouvements enregistrés.
 */
function recomputeClientBalance(c){
  c.balance = Math.max(0, c.history.reduce((a,h)=> a + (h.type==='vente' ? h.amount : -h.amount), 0));
}

/**
 * Calcule ce qui a déjà été versé à un employé pour un mois donné
 * (avances + paiement de solde) et ce qu'il reste à payer.
 * @param {string} mk - clé de mois au format 'YYYY-MM'
 */
function employeeMonthStatus(employeeId, mk){
  const emp = state.employees.find(x=>x.id===employeeId);
  const entries = state.salaryEntries.filter(s=>s.employeeId===employeeId && s.date.slice(0,7)===mk);
  const given = entries.reduce((a,s)=>a+s.amount,0);
  const remaining = Math.max(0, (emp?emp.monthlySalary:0) - given);
  return {entries, given, remaining};
}

/* ============================== RAPPORTS ============================== */
let reportPeriod = 'mois';
const REPORT_PERIODS = [
  ['semaine','Semaine'], ['mois','Mois'], ['trimestre','Trimestre'],
  ['semestre','Semestre'], ['annee','Année'], ['general','Général']
];

/**
 * Calcule la date de début d'une période à partir d'aujourd'hui.
 * 'general' n'a pas de borne (depuis le tout début de l'activité).
 */
function periodRange(type){
  const now = new Date();
  let start, label;
  if(type==='semaine'){
    start = new Date(now); start.setDate(now.getDate()-6); start.setHours(0,0,0,0);
    label = '7 derniers jours';
  } else if(type==='mois'){
    start = new Date(now.getFullYear(), now.getMonth(), 1);
    label = monthLabel(curMonthKey());
  } else if(type==='trimestre'){
    const q = Math.floor(now.getMonth()/3);
    start = new Date(now.getFullYear(), q*3, 1);
    label = `${q+1}ᵉ trimestre ${now.getFullYear()}`;
  } else if(type==='semestre'){
    const half = now.getMonth() < 6 ? 0 : 6;
    start = new Date(now.getFullYear(), half, 1);
    label = (half===0 ? '1er semestre' : '2ᵉ semestre') + ' ' + now.getFullYear();
  } else if(type==='annee'){
    start = new Date(now.getFullYear(), 0, 1);
    label = String(now.getFullYear());
  } else {
    start = new Date(0);
    label = "Depuis le début de l'activité";
  }
  return {start, end: now, label};
}

/**
 * Agrège ventes, dépenses, salaires et crédits sur une période donnée.
 * C'est la donnée source à la fois pour l'affichage à l'écran et pour
 * les exports PDF/Word — un seul calcul, deux présentations.
 */
/**
 * Agrège ventes, dépenses, salaires et crédits sur une période donnée.
 * Calcule aussi la vraie marge bénéficiaire (ventes − coût d'achat des
 * produits vendus), distincte du simple solde de trésorerie qui ne
 * regarde que les prix de vente. Les articles vendus sans prix d'achat
 * renseigné comptent pour un coût de 0 — ça gonfle artificiellement la
 * marge, donc on compte aussi combien d'articles sont dans ce cas pour
 * pouvoir prévenir l'utilisateur si la donnée est incomplète.
 */
function computeReport(type){
  const {start, end, label} = periodRange(type);
  const inRange = (d)=>{ const dt = new Date(d); return dt >= start && dt <= end; };
  const sales = state.sales.filter(s=>inRange(s.date));
  const cashCount = sales.filter(s=>s.type==='cash').length;
  const creditCount = sales.filter(s=>s.type==='credit').length;
  const mobileMoneyCount = sales.filter(s=>s.type==='mobilemoney').length;
  const totalSales = sales.reduce((a,s)=>a+s.total,0);
  const totalExpenses = state.expenses.filter(e=>inRange(e.date)).reduce((a,e)=>a+e.amount,0);
  const totalSalaries = state.salaryEntries.filter(s=>inRange(s.date)).reduce((a,s)=>a+s.amount,0);
  const creditPayments = state.credits.flatMap(c=>c.history.filter(h=>h.type==='paiement' && inRange(h.date)));
  const totalCreditPayments = creditPayments.reduce((a,h)=>a+h.amount,0);
  const qtyByProduct = {};
  let totalCost = 0, itemsSold = 0, itemsWithoutCost = 0;
  sales.forEach(s=>s.items.forEach(it=>{
    qtyByProduct[it.name] = (qtyByProduct[it.name]||0) + it.qty;
    totalCost += (it.cost||0) * it.qty;
    itemsSold += it.qty;
    if(!it.cost) itemsWithoutCost += it.qty;
  }));
  const top = Object.entries(qtyByProduct).sort((a,b)=>b[1]-a[1])[0];
  const cashFlow = totalSales - totalExpenses - totalSalaries;
  const grossMargin = totalSales - totalCost;
  const netMargin = grossMargin - totalExpenses - totalSalaries;
  return {label, start, end, sales, totalSales, cashCount, creditCount, mobileMoneyCount, totalExpenses, totalSalaries,
    totalCreditPayments, top, cashFlow, totalCost, grossMargin, netMargin, itemsSold, itemsWithoutCost};
}

/** Construit une série jour-par-jour des 14 derniers jours pour le graphique de tendance. */
function renderTrendChart(){
  const canvas = document.getElementById('trendChart');
  if(!canvas || typeof Chart === 'undefined') return;
  const days = [];
  for(let i=13; i>=0; i--){
    const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i);
    days.push(d);
  }
  const labels = days.map(d=>d.toLocaleDateString('fr-FR', {day:'numeric', month:'short'}));
  const values = days.map(d=>{
    const next = new Date(d); next.setDate(d.getDate()+1);
    return state.sales.filter(s=>{ const sd = new Date(s.date); return sd>=d && sd<next; })
      .reduce((a,s)=>a+s.total,0);
  });
  if(chartInstance){ chartInstance.destroy(); }
  chartInstance = new Chart(canvas.getContext('2d'), {
    type: 'bar',
    data: { labels, datasets: [{ label: 'Ventes (FCFA)', data: values, backgroundColor: '#d4972c', borderRadius: 4 }] },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color:'#1b2a4a', font:{size:9} }, grid: { display:false } },
        y: { ticks: { color:'#1b2a4a', font:{size:9} }, grid: { color:'rgba(27,42,74,0.08)' } }
      }
    }
  });
}

function downloadWordReport(){
  const r = computeReport(reportPeriod);
  const html = buildReportWordHtml(r);
  const blob = new Blob(['\ufeff', html], {type:'application/msword'});

  a.href = url;
  a.download = `rapport-${reportPeriod}-${new Date().toISOString().slice(0,10)}.doc`;
  document.body.appendChild(a);

  a.remove();
  URL.revokeObjectURL(url);

}

/**
 * Calcule, pour chaque produit (et poids), la vitesse de vente réelle
 * sur les 30 derniers jours et en déduit une estimation du nombre de
 * jours avant rupture. Ne remonte que les articles encore en stock
 * dont l'estimation est inférieure à 7 jours — les ruptures déjà
 * effectives sont gérées séparément par alertStockDepleted/la section
 * "Ruptures de stock".
 */
function computeRestockSuggestions(){
  const since = new Date(); since.setDate(since.getDate()-30);
  const qtyByKey = {};
  state.sales.forEach(s=>{
    if(new Date(s.date) < since) return;
    s.items.forEach(it=>{
      const key = it.variantId ? it.id+'::'+it.variantId : it.id;
      qtyByKey[key] = (qtyByKey[key]||0) + it.qty;
    });
  });
  const results = [];
  state.products.forEach(p=>{
    if(p.hasVariants){
      p.variants.forEach(v=>{
        if(v.stock<=0) return;
        const key = p.id+'::'+v.id;
        const sold = qtyByKey[key] || 0;
        const rate = sold/30;
        if(rate<=0) return;
        const daysLeft = Math.floor(v.stock/rate);
        if(daysLeft<7) results.push({name:`${p.name} (${v.label})`, daysLeft, rate: rate.toFixed(1)});
      });
    } else {
      if(p.stock<=0) return;
      const sold = qtyByKey[p.id] || 0;
      const rate = sold/30;
      if(rate<=0) return;
      const daysLeft = Math.floor(p.stock/rate);
      if(daysLeft<7) results.push({name:p.name, daysLeft, rate: rate.toFixed(1)});
    }
  });
  return results.sort((a,b)=>a.daysLeft-b.daysLeft).slice(0,8);
}

      <div class="row-sub" style="margin-bottom:12px;">Personnalise l'en-tête de l'appli avec le nom, le logo et la bannière de ton commerce.</div>
      <button class="btn btn-outline" onclick="openCompanySettingsModal()">🏪 Modifier les informations</button>
    </div>
    <h2 class="section-title">Licence</h2>
    <div class="card">
      ${isLicensed() ? `
        <div class="row-sub">✅ Licence activée — merci pour ton soutien !</div>
      ` : `
        <div class="row-sub" style="margin-bottom:8px;">Essai gratuit : <b>${trialDaysLeft()} jour${trialDaysLeft()>1?'s':''}</b> restant${trialDaysLeft()>1?'s':''}.</div>
        <div class="row-sub" style="margin-bottom:12px; color:var(--gold-dark); font-weight:600;">${money(PRICE_MONTHLY)} / mois · ${money(PRICE_YEARLY)} / an</div>
        <div class="row-sub" style="margin-bottom:12px;">Tu as déjà un code d'activation ?</div>
        <label>Ton numéro de téléphone</label>
        <input type="tel" id="resPhone" placeholder="Ex: 90112233">
        <label>Code d'activation</label>
        <input type="text" id="resCode" placeholder="Ex: 348217">
        <div style="height:10px;"></div>
        <button class="btn btn-gold" onclick="activateLicenseFromResume()">Activer</button>
      `}
    </div>
    <h2 class="section-title">Sécurité</h2>
    <div class="card">
      <div class="row-sub" style="margin-bottom:12px;">${state.pin ? "Un code PIN protège l'ouverture de l'appli." : "Ajoute un code PIN pour empêcher que n'importe qui ouvre l'appli."}</div>
      <button class="btn btn-outline" onclick="openPinSettingsModal()">${state.pin?'🔒 Gérer le code PIN':'🔒 Activer un code PIN'}</button>
    </div>
    <h2 class="section-title">Corrections</h2>
    <div class="card">
      ${lastSaleInfo ? `
        <div class="row-sub" style="margin-bottom:12px;">Dernière vente : ${money(lastSaleInfo.total)} — ${new Date(lastSaleInfo.date).toLocaleString('fr-FR')}${lastSaleInfo.type==='credit'?' (crédit, '+escapeHtml(lastSaleInfo.clientName)+')':''}</div>
        <button class="btn btn-danger" onclick="confirmCancelLastSale()">Annuler la dernière vente</button>
      ` : `<div class="row-sub">Aucune vente à annuler.</div>`}

    <h2 class="section-title">Sauvegarde</h2>
    <div class="card">
      <div class="row-sub" style="margin-bottom:12px;">Garde une copie de tes données au cas où ton téléphone serait perdu, cassé ou changé.</div>
      <div class="btn-row">
        <button class="btn btn-outline" onclick="exportData()">⬇️ Exporter</button>
        <button class="btn btn-outline" onclick="document.getElementById('importFile').click()">⬆️ Importer</button>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" style="display:none" onchange="importData(event)">
    </div>

      Kpalimé, Kloto — Yaovi Honoré — 98311080
    </div>
  `;
}

/* ---------- Sauvegarde (export/import JSON) et corrections, exposées depuis l'onglet Résumé ---------- */
function exportData(){
  const payload = JSON.stringify({products: state.products, sales: state.sales, credits: state.credits}, null, 2);
  const blob = new Blob([payload], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `caisse-simple-sauvegarde-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast('⬇️ Sauvegarde téléchargée');
}

function importData(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!data.products || !data.sales || !data.credits) throw new Error('format invalide');
      openModal(`
        <div class="modal-handle"></div>
        <h3>Importer cette sauvegarde ?</h3>
        <div class="row-sub" style="margin-bottom:16px;">
          Elle contient ${data.products.length} produit(s), ${data.sales.length} vente(s) et ${data.credits.length} client(s) à crédit.
          <br><br><b>Attention :</b> ça va remplacer toutes les données actuelles de l'appli.
        </div>
        <div class="btn-row">
          <button class="btn btn-outline" onclick="closeModal()">Annuler</button>
          <button class="btn btn-gold" onclick="confirmImport()">Remplacer</button>
        </div>
      `);
      window.__pendingImport = data;
    }catch(e){
      toast('⚠️ Fichier de sauvegarde invalide');
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}

async function confirmImport(){
  const data = window.__pendingImport;
  if(!data) return;
  state.products = data.products;
  state.sales = data.sales;
  state.credits = data.credits;
  state.cart = [];
  await saveData();
  window.__pendingImport = null;
  closeModal();
  render();
  toast('✅ Sauvegarde importée');
}

function confirmCancelLastSale(){
  const sale = state.sales[state.sales.length-1];
  if(!sale) return;
  confirmCancelSale(sale.id);
}

function confirmCancelSale(saleId){
  const sale = state.sales.find(s=>s.id===saleId);
  if(!sale) return;
  openModal(`
    <div class="modal-handle"></div>
    <h3>Annuler cette vente ?</h3>
    <div class="row-sub" style="margin-bottom:6px;">${new Date(sale.date).toLocaleString('fr-FR')} · ${money(sale.total)}</div>
    <div class="row-sub" style="margin-bottom:16px;">Le stock sera remis à jour${sale.type==='credit' ? " et le solde du client sera corrigé" : ""}. Cette action est irréversible.</div>
    <div class="btn-row">
      <button class="btn btn-outline" onclick="closeModal()">Annuler</button>
      <button class="btn btn-danger" onclick="cancelSale('${saleId}')">Confirmer</button>
    </div>
  `);
}

/**
 * Annule n'importe quelle vente (pas seulement la dernière) : restaure
 * le stock des produits vendus et, si c'était une vente à crédit,
 * retire le montant du solde du client et l'entrée correspondante de
 * son historique.
 */
async function cancelSale(saleId){
  const idx = state.sales.findIndex(s=>s.id===saleId);
  if(idx===-1){ closeModal(); return; }
  const sale = state.sales[idx];
  sale.items.forEach(it=>{
    const p = state.products.find(x=>x.id===it.id);
    if(!p || it.customVariant) return;
    if(it.weightKg){
      p.stockKg += it.weightKg*it.qty;
    } else if(it.variantId){
      const v = p.variants && p.variants.find(x=>x.id===it.variantId);
      if(v) v.stock += it.qty;
    } else {
      p.stock += it.qty;
    }
  });
  if(sale.type==='credit' && sale.clientId){
    const c = state.credits.find(x=>x.id===sale.clientId);
    if(c){
      c.balance = Math.max(0, c.balance - sale.total);
      const match = c.history.map((h,i)=>({h,i})).reverse()
        .find(x=>x.h.type==='vente' && x.h.amount===sale.total && x.h.date===sale.date);
      if(match) c.history.splice(match.i,1);
    }
  }
  state.sales.splice(idx,1);
  await saveData();
  closeModal();
  render();
  toast('↩️ Vente annulée');
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

loadData();

/* ============================== INSTALLATION EN APPLI (PWA) ============================== */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}

let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  const btn = document.getElementById('installBtn');
  if(btn) btn.style.display = '';
});

async function installApp(){
  if(!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  const btn = document.getElementById('installBtn');
  if(btn) btn.style.display = 'none';
}

/**
 * Bascule le mode plein écran du navigateur (utile sur PC, où
 * l'ouverture "plein écran" du manifeste ne s'applique qu'à l'appli
 * installée — ce bouton fonctionne aussi dans un simple onglet).
 */
function toggleFullscreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen().catch(()=>{
      toast('⚠️ Plein écran non supporté sur ce navigateur');
    });
  } else {
    document.exitFullscreen();
  }
}
