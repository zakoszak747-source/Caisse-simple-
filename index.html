<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Caisse Simple</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#141b30">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Caisse Simple">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --indigo-dark:#141b30;
    --indigo:#1f3057;
    --indigo-light:#2b4272;
    --sand:#f3ecda;
    --cream:#fbf7ed;
    --gold:#d4972c;
    --gold-dark:#b67f1e;
    --terracotta:#c1443c;
    --green:#4c7a52;
    --ink:#1b2a4a;
    --line:rgba(27,42,74,0.12);
    --shadow: 0 4px 14px rgba(20,27,48,0.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Work Sans', -apple-system, Roboto, sans-serif;
    background:var(--indigo-dark);
    color:var(--ink);
    overscroll-behavior:none;
  }
  .num{font-family:'Space Grotesk', 'Work Sans', sans-serif;}
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--cream);
    display:flex;
    flex-direction:column;
    position:relative;
  }
  header.topbar{
    background:var(--indigo-dark);
    color:var(--sand);
    padding:18px 18px 14px;
    position:sticky; top:0; z-index:20;
    box-shadow:var(--shadow);
  }
  #settingsGearBtn{
    position:absolute; top:16px; right:16px; z-index:2;
    background:rgba(243,236,218,0.1); border:none; border-radius:8px;
    width:32px; height:32px; font-size:15px; color:var(--sand);
  }
  header.topbar .brand{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:20px;
    letter-spacing:0.02em;
    display:flex; align-items:center; gap:8px;
  }
  header.topbar .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);display:inline-block;}
  header.topbar .sub{font-size:12px;color:rgba(243,236,218,0.8);margin-top:2px;}
  header.topbar .clock{font-size:22px; font-weight:600; color:var(--gold); margin-top:6px; letter-spacing:0.03em;}
  .banner-img{width:100%; max-height:110px; object-fit:cover; border-radius:8px; margin-bottom:10px; display:block;}
  .logo-img{width:26px; height:26px; border-radius:6px; object-fit:cover; margin-right:8px; flex-shrink:0; vertical-align:middle;}
  .thumb{width:40px; height:40px; border-radius:8px; object-fit:cover; margin-right:12px; flex-shrink:0;}
  main{flex:1; padding:14px 14px 100px; overflow-y:auto;}

  /* ledger card */
  .card{
    background:var(--sand);
    border-radius:10px;
    padding:14px;
    margin-bottom:12px;
    box-shadow:0 1px 0 rgba(27,42,74,0.06);
    border:1px solid var(--line);
  }
  .ledger-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 4px;
    border-bottom:1px solid var(--line);
    position:relative;
    padding-left:14px;
  }
  .ledger-row::before{
    content:"";
    position:absolute; left:0; top:0; bottom:0; width:2px;
    background:var(--gold);
    opacity:0.55;
  }
  .ledger-row:last-child{border-bottom:none;}
  .row-main{display:flex; flex-direction:column; gap:2px; min-width:0; flex:1;}
  .row-title{font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .row-sub{font-size:12.5px; color:rgba(27,42,74,0.78);}
  .row-right{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .price{font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:15px;}
  .badge{
    font-size:11px; font-weight:600; padding:3px 8px; border-radius:20px;
    background:rgba(76,122,82,0.15); color:var(--green);
  }
  .badge.low{background:rgba(193,68,60,0.15); color:var(--terracotta);}
  .badge.gold{background:rgba(212,151,44,0.18); color:var(--gold-dark);}

  input[type=text], input[type=number], input[type=tel]{
    width:100%; padding:11px 12px; border-radius:8px; border:1px solid var(--line);
    background:var(--cream); font-size:15px; font-family:inherit; color:var(--ink);
  }
  input:focus{outline:2px solid var(--gold); outline-offset:1px;}
  label{font-size:12.5px; font-weight:600; color:rgba(27,42,74,0.85); display:block; margin-bottom:5px; margin-top:12px;}
  label:first-child{margin-top:0;}

  .search-wrap{position:relative; margin-bottom:12px;}
  .search-wrap input{padding-left:34px;}
  .search-wrap .icon{position:absolute; left:11px; top:50%; transform:translateY(-50%); opacity:0.5; font-size:14px;}

  button{font-family:inherit; cursor:pointer; border:none;}
  .btn{
    padding:13px 16px; border-radius:9px; font-weight:600; font-size:14.5px;
    width:100%; text-align:center; transition:transform .08s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--indigo-dark); color:var(--sand);}
  .btn-gold{background:var(--gold); color:var(--indigo-dark);}
  .btn-green{background:var(--green); color:var(--cream);}
  .btn-outline{background:transparent; border:1.5px solid var(--indigo-dark); color:var(--indigo-dark);}
  .btn-danger{background:transparent; color:var(--terracotta); border:1.5px solid rgba(193,68,60,0.4);}
  .btn-row{display:flex; gap:10px;}
  .btn-sm{padding:7px 12px; font-size:13px; border-radius:7px; width:auto;}

  .empty{
    text-align:center; padding:40px 20px; color:rgba(27,42,74,0.65);
  }
  .empty .big{font-size:32px; margin-bottom:8px;}
  .empty .msg{font-size:14px; line-height:1.5;}

  h2.section-title{
    font-family:'Space Grotesk', sans-serif; font-size:14px; font-weight:600;
    text-transform:uppercase; letter-spacing:0.06em; color:rgba(27,42,74,0.7);
    margin:4px 0 10px;
  }

  /* bottom nav */
  nav.tabbar{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:480px;
    background:var(--indigo-dark);
    display:flex; z-index:30;
    box-shadow:0 -4px 14px rgba(0,0,0,0.25);
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav.tabbar button{
    flex:1; background:none; padding:9px 1px 11px; display:flex; flex-direction:column;
    align-items:center; gap:2px; color:rgba(243,236,218,0.68);
  }
  nav.tabbar button.active{color:var(--gold);}
  nav.tabbar .ic{font-size:16px;}
  nav.tabbar .lb{font-size:8.8px; font-weight:600; letter-spacing:0.005em;}

  /* cart bar */
  .cartbar{
    position:fixed; bottom:64px; left:50%; transform:translateX(-50%);
    width:calc(100% - 28px); max-width:452px;
    background:var(--indigo-dark); color:var(--sand);
    border-radius:12px; padding:12px 16px;
    display:flex; align-items:center; justify-content:space-between;
    box-shadow:var(--shadow); z-index:25;
  }
  .cartbar .info{display:flex; flex-direction:column;}
  .cartbar .count{font-size:11.5px; color:rgba(243,236,218,0.8);}
  .cartbar .total{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px;}
  .cartbar button{background:var(--gold); color:var(--indigo-dark); padding:9px 16px; border-radius:8px; font-weight:700; font-size:13.5px;}

  /* modal */
  .overlay{
    position:fixed; inset:0; background:rgba(20,27,48,0.55); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal{
    background:var(--cream); width:100%; max-width:480px;
    border-radius:16px 16px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    max-height:86vh; overflow-y:auto;
  }
  .modal-handle{width:36px; height:4px; background:var(--line); border-radius:4px; margin:0 auto 14px;}
  .modal h3{font-family:'Space Grotesk',sans-serif; margin:0 0 14px; font-size:18px;}
  .modal .close-x{position:absolute; top:16px; right:16px; font-size:20px; background:none; color:rgba(27,42,74,0.65);}

  .stepper{display:flex; align-items:center; gap:10px;}
  .stepper button{
    width:30px; height:30px; border-radius:7px; background:var(--indigo-dark); color:var(--sand);
    font-size:16px; font-weight:700; display:flex; align-items:center; justify-content:center;
  }
  .stepper .qty{min-width:22px; text-align:center; font-weight:600; font-family:'Space Grotesk',sans-serif;}

  .toast{
    position:fixed; top:14px; left:50%; transform:translateX(-50%);
    background:var(--indigo-dark); color:var(--sand); padding:10px 18px; border-radius:24px;
    font-size:13.5px; font-weight:600; z-index:80; box-shadow:var(--shadow);
    display:flex; align-items:center; gap:6px;
  }
  .summary-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .summary-tile{background:var(--indigo-dark); color:var(--sand); border-radius:10px; padding:14px;}
  .summary-tile .lbl{font-size:11px; color:rgba(243,236,218,0.78); margin-bottom:4px;}
  .summary-tile .val{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:19px;}
  .summary-tile.gold{background:var(--gold); color:var(--indigo-dark);}
  .summary-tile.gold .lbl{color:rgba(27,42,74,0.75);}

  .lockscreen{
    position:fixed; inset:0; background:var(--indigo-dark); z-index:100;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--sand); padding:20px;
  }
  .lockscreen .brand{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:20px; margin-bottom:6px;}
  .lockscreen .hint{font-size:13px; color:rgba(243,236,218,0.8); margin-bottom:28px;}
  .pindots{display:flex; gap:14px; margin-bottom:34px;}
  .pindots .d{width:14px; height:14px; border-radius:50%; border:1.5px solid rgba(243,236,218,0.5);}
  .pindots .d.filled{background:var(--gold); border-color:var(--gold);}
  .keypad{display:grid; grid-template-columns:repeat(3,64px); gap:14px;}
  .keypad button{
    width:64px; height:64px; border-radius:50%; background:rgba(243,236,218,0.08);
    color:var(--sand); font-size:20px; font-weight:600; font-family:'Space Grotesk',sans-serif;
  }
  .keypad button:active{background:rgba(243,236,218,0.18);}

  .payslip{
    background:#fff; color:#1b2a4a; padding:24px; font-family:'Work Sans',sans-serif;
    border:1px solid var(--line); border-radius:8px;
  }
  .payslip h4{font-family:'Space Grotesk',sans-serif; margin:0 0 2px; font-size:17px;}
  .payslip .meta{font-size:12px; color:#555; margin-bottom:16px;}
  .payslip table{width:100%; border-collapse:collapse; font-size:13.5px;}
  .payslip td{padding:7px 2px; border-bottom:1px solid #eee;}
  .payslip td:last-child{text-align:right; font-family:'Space Grotesk',sans-serif;}
  .payslip .net{font-weight:700; font-size:15.5px;}
  #printArea{display:none;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{display:block; position:absolute; top:0; left:0; width:100%;}
  }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div id="bannerWrap"></div>
    <button id="settingsGearBtn" onclick="activeTab='reglages'; render();" aria-label="Réglages">⚙️</button>
    <div class="brand" id="brandLine"><span class="dot"></span>Caisse Simple</div>
    <div class="sub" id="dateLabel"></div>
    <div class="clock num" id="clockLabel"></div>
  </header>
  <main id="main"></main>
  <div id="cartbarWrap"></div>
  <nav class="tabbar">
    <button data-tab="vente" class="tabbtn"><span class="ic">🛒</span><span class="lb">Vente</span></button>
    <button data-tab="stock" class="tabbtn"><span class="ic">📦</span><span class="lb">Stock</span></button>
    <button data-tab="credits" class="tabbtn"><span class="ic">🤝</span><span class="lb">Crédits</span></button>
    <button data-tab="depenses" class="tabbtn"><span class="ic">💵</span><span class="lb">Dépenses</span></button>
    <button data-tab="rapports" class="tabbtn"><span class="ic">📈</span><span class="lb">Rapports</span></button>
    <button data-tab="resume" class="tabbtn"><span class="ic">📊</span><span class="lb">Résumé</span></button>
  </nav>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<div id="lockScreen" class="lockscreen" style="display:none;"></div>
<div id="paywallScreen" class="lockscreen" style="display:none;"></div>
<div id="splashScreen" class="lockscreen" style="display:flex; z-index:200;">
  <img src="icon-192.png" alt="" style="width:88px; height:88px; border-radius:18px; margin-bottom:20px;" onerror="this.style.display='none';">
  <div class="brand" style="font-size:22px; text-align:center;">BIENVENUE DANS<br>CAISSE SIMPLE</div>
</div>
<div id="printArea"></div>

<script>
/**
 * CAISSE SIMPLE — appli de caisse/inventaire pour petits commerces
 * =================================================================
 * Architecture : une seule page, pas de framework, pas de build.
 * `render()` réaffiche entièrement l'onglet actif à chaque changement
 * d'état — pas de diffing, le DOM est régénéré via innerHTML. Simple
 * et suffisant vu la taille des données manipulées.
 *
 * Persistance : tout `state` (hors panier en cours) est sauvegardé
 * dans localStorage sous une seule clé ('shop-data') à chaque mutation,
 * via saveData(). C'est la seule source de vérité entre les sessions.
 *
 * Modèle de données (voir `state` ci-dessous) :
 *   products      { id, name, price, stock, lowStock }
 *   sales         { id, date, items[], total, type: 'cash'|'credit', clientId, clientName }
 *   credits       { id, name, phone, balance, history[{date,type:'vente'|'paiement',amount,note}] }
 *   expenses      { id, date, label, amount }
 *   employees     { id, name, monthlySalary }
 *   salaryEntries { id, employeeId, date, type:'avance'|'paiement', amount, note }
 *   pin           code à 4 chiffres ou null (verrouillage de l'appli)
 *
 * Plan du fichier : STATE & PERSISTANCE → UTILITAIRES → MODALES/TOASTS
 * → VERROUILLAGE PIN → NAVIGATION → VENTE → STOCK → CRÉDITS → DÉPENSES
 * → RÉSUMÉ (inclut sauvegarde JSON et annulation de vente).
 */

/* ============================== STATE & PERSISTANCE ============================== */
let state = { products: [], sales: [], credits: [], cart: [], pin: null, expenses: [], employees: [], salaryEntries: [], company: { name:'', logo:'', banner:'' }, reportPhone: '', autoReport: false, templateUsage: {}, trialStart: null, licensePhone: '', licenseCode: '', domains: [], domainsSeeded: false, suppliers: [], purchases: [], language: 'fr', translations: {}, adjustments: [], sellers: [], activeSeller: '' };
let activeTab = 'vente';
let ready = false;
let locked = false;
let pinBuffer = '';
const LOW_STOCK = 5;
const TRIAL_DAYS = 14;

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function money(n){ return Math.round(n).toLocaleString('fr-FR') + ' FCFA'; }
function norm(s){ return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
function todayStr(){ return new Date().toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'}); }

/**
 * Redonne le focus (et repositionne le curseur en fin de texte) à un
 * champ de recherche juste après un re-rendu complet de la section.
 * Sans ça, remplacer le HTML détruit et recrée l'input à chaque
 * frappe, ce qui fait perdre le focus et referme le clavier du
 * téléphone à chaque lettre tapée.
 */
function refocusSearch(id){
  const el = document.getElementById(id);
  if(el){ el.focus(); const len = el.value.length; el.setSelectionRange(len, len); }
}

/* ============================== LANGUE & TRADUCTIONS (ÉWÉ) ============================== */
/**
 * Plutôt que d'imposer des traductions éwé que Claude ne peut pas
 * garantir fiables pour du vocabulaire commercial précis, ce système
 * laisse le commerçant fournir lui-même les mots exacts. Chaque clé
 * a un texte français par défaut ; state.translations['clé'] contient
 * le mot éwé correspondant si le commerçant l'a renseigné. t(key)
 * bascule automatiquement selon state.language, avec repli sur le
 * français si la traduction n'a pas encore été fournie.
 */
const TRANSLATABLE_KEYS = [
  ['tab_vente', 'Vente'],
  ['tab_stock', 'Stock'],
  ['tab_credits', 'Crédits'],
  ['tab_depenses', 'Dépenses'],
  ['tab_rapports', 'Rapports'],
  ['tab_resume', 'Résumé'],
  ['btn_payer_cash', 'Payer cash'],
  ['btn_credit', 'Crédit'],
  ['btn_mobilemoney', 'Mobile Money'],
  ['label_panier', 'Panier'],
  ['label_client', 'Client'],
  ['label_total', 'Total'],
  ['label_produit', 'Produit'],
  ['label_stock_bas', 'Stock bas'],
  ['label_aujourdhui', "Aujourd'hui"]
];

function t(key){
  const fr = (TRANSLATABLE_KEYS.find(k=>k[0]===key)||[null,key])[1];
  if(state.language === 'ewe' && state.translations[key]) return state.translations[key];
  return fr;
}

/** Met à jour les libellés de la barre de navigation (HTML statique, pas régénérée par render()). */
function applyLanguageToNav(){
  const map = { vente:'tab_vente', stock:'tab_stock', credits:'tab_credits', depenses:'tab_depenses', rapports:'tab_rapports', resume:'tab_resume' };
  document.querySelectorAll('.tabbtn').forEach(btn=>{
    const key = map[btn.dataset.tab];
    if(key){ const lb = btn.querySelector('.lb'); if(lb) lb.textContent = t(key); }
  });
}

function openLanguageSettingsModal(){
  openModal(`
    <div class="modal-handle"></div>
    <h3>Langue & traductions</h3>
    <div class="row-sub" style="margin-bottom:12px;">Choisis la langue d'affichage, et renseigne toi-même les mots éwé pour chaque terme — je préfère te laisser les mots exacts plutôt que de deviner.</div>
    <div class="btn-row" style="margin-bottom:16px;">
      <button class="btn ${state.language==='fr'?'btn-gold':'btn-outline'}" onclick="setLanguage('fr')">Français</button>
      <button class="btn ${state.language==='ewe'?'btn-gold':'btn-outline'}" onclick="setLanguage('ewe')">Éwé</button>
    </div>
    <h2 class="section-title">Glossaire éwé</h2>
    <div id="glossaryRows">
      ${TRANSLATABLE_KEYS.map(([key,fr])=>`
        <label style="margin-top:10px;">${escapeHtml(fr)}</label>
        <input type="text" class="gloss-input" data-key="${key}" value="${escapeHtml(state.translations[key]||'')}" placeholder="Mot en éwé...">
      `).join('')}
    </div>
    <div style="height:16px;"></div>
    <button class="btn btn-gold" onclick="saveTranslations()">Enregistrer le glossaire</button>
  `);
}

async function setLanguage(lang){
  state.language = lang;
  await saveData();
  applyLanguageToNav();
  render();
  toast(lang==='ewe' ? '✅ Langue : Éwé' : '✅ Langue : Français');
}

async function saveTranslations(){
  document.querySelectorAll('.gloss-input').forEach(inp=>{
    const val = inp.value.trim();
    if(val) state.translations[inp.dataset.key] = val;
    else delete state.translations[inp.dataset.key];
  });
  await saveData();
  applyLanguageToNav();
  closeModal();
  render();
  toast('✅ Glossaire enregistré');
}

/**
 * Petit texte coloré à afficher à côté d'un produit dans les listes,
 * quand une date de péremption est renseignée et proche (≤30 jours)
 * ou dépassée. Retourne une chaîne vide si pas de date ou date lointaine.
 */
function expiryBadge(dateStr){
  if(!dateStr) return '';
  const days = Math.floor((new Date(dateStr) - new Date()) / 86400000);
  if(days < 0) return ` · <span style="color:var(--terracotta); font-weight:600;">expiré</span>`;
  if(days <= 30) return ` · <span style="color:var(--terracotta); font-weight:600;">périme dans ${days} j</span>`;
  return '';
}

/**
 * Liste tous les produits (et poids) expirés ou périmant sous 30
 * jours, triés du plus urgent au moins urgent — alimente la section
 * "Péremption" du Résumé.
 */
function computeExpiryAlerts(){
  const results = [];
  const consider = (name, dateStr)=>{
    if(!dateStr) return;
    const days = Math.floor((new Date(dateStr) - new Date()) / 86400000);
    if(days <= 30) results.push({name, days, expired: days<0});
  };
  state.products.forEach(p=>{
    if(p.hasVariants){
      p.variants.forEach(v=> consider(`${p.name} (${v.label})`, v.expiryDate));
    } else {
      consider(p.name, p.expiryDate);
    }
  });
  return results.sort((a,b)=>a.days-b.days);
}

/** Montre numérique dans l'en-tête, mise à jour chaque seconde. */
function updateClock(){
  const el = document.getElementById('clockLabel');
  if(el) el.textContent = new Date().toLocaleTimeString('fr-FR');
}
updateClock();
setInterval(updateClock, 1000);

/* ============================== ESSAI GRATUIT & LICENCE ============================== */
/**
 * Sel utilisé pour générer/valider les codes de licence. Comme cette
 * appli tourne entièrement côté client sans serveur, ce sel est
 * forcément visible dans le code source par quelqu'un de suffisamment
 * technique — ce système dissuade le partage/la réutilisation
 * occasionnelle de codes, ce n'est pas un verrou inviolable. Le
 * générateur de codes (côté propriétaire) utilise exactement le même
 * sel et doit rester privé, jamais publié avec l'appli.
 */
const LICENSE_SALT = 'zakoszak-caisse-2026';
const PRICE_MONTHLY = 2500;
const PRICE_YEARLY = 25000;

/** Calcule le code de licence attendu pour un numéro de téléphone donné. */
function licenseHash(phone){
  const clean = (phone||'').replace(/[^0-9]/g,'');
  const input = clean + LICENSE_SALT;
  let hash = 0;
  for(let i=0;i<input.length;i++){
    hash = (hash * 31 + input.charCodeAt(i)) >>> 0;
  }
  const code = (hash % 900000) + 100000;
  return String(code);
}

function daysSince(isoDate){
  if(!isoDate) return 0;
  return Math.floor((Date.now() - new Date(isoDate).getTime()) / 86400000);
}

function trialDaysLeft(){
  return Math.max(0, TRIAL_DAYS - daysSince(state.trialStart));
}

function isLicensed(){
  return !!(state.licensePhone && state.licenseCode && licenseHash(state.licensePhone) === state.licenseCode);
}

function isAppLocked(){
  return !isLicensed() && trialDaysLeft() <= 0;
}

/**
 * Charge shop-data depuis le stockage persistant, ou démarre à vide
 * si rien n'existe encore. Utilise localStorage — le stockage du
 * navigateur — qui persiste réellement une fois l'appli hébergée en
 * dehors de Claude (GitHub Pages, fichier ouvert directement...).
 * Si l'appli tourne exceptionnellement dans un aperçu Claude (qui
 * expose window.storage), ce stockage-là est utilisé à la place.
 * Affiche l'écran de verrouillage si un PIN est enregistré, sinon
 * affiche directement l'appli.
 */
function applyLoadedData(parsed){
  state.products = parsed.products || [];
  state.sales = parsed.sales || [];
  state.credits = parsed.credits || [];
  state.pin = parsed.pin || null;
  state.expenses = parsed.expenses || [];
  state.employees = parsed.employees || [];
  state.salaryEntries = parsed.salaryEntries || [];
  state.company = parsed.company || { name:'', logo:'', banner:'' };
  state.reportPhone = parsed.reportPhone || '';
  state.autoReport = !!parsed.autoReport;
  state.templateUsage = parsed.templateUsage || {};
  state.trialStart = parsed.trialStart || null;
  state.licensePhone = parsed.licensePhone || '';
  state.licenseCode = parsed.licenseCode || '';
  state.domains = parsed.domains || [];
  state.domainsSeeded = !!parsed.domainsSeeded;
  state.suppliers = parsed.suppliers || [];
  state.purchases = parsed.purchases || [];
  state.language = parsed.language || 'fr';
  state.translations = parsed.translations || {};
  state.adjustments = parsed.adjustments || [];
  state.sellers = parsed.sellers || [];
  state.activeSeller = parsed.activeSeller || '';
  migrateWeightFields();
}

/**
 * Convertit les anciens champs "vente au poids" en grammes (utilisés
 * dans une version précédente) vers les champs actuels en kilos, pour
 * les produits déjà enregistrés avant ce changement. Sans ça, un
 * produit créé avec l'ancien format ferait planter l'affichage
 * (champs manquants) au lieu de simplement continuer à fonctionner.
 */
function migrateWeightFields(){
  state.products.forEach(p=>{
    if(!p.sellByWeight) return;
    if(p.stockKg === undefined && p.stockGrams !== undefined){
      p.stockKg = p.stockGrams / 1000;
      delete p.stockGrams;
    }
    if(p.refWeightKg === undefined && p.refWeightGrams !== undefined){
      p.refWeightKg = p.refWeightGrams / 1000;
      delete p.refWeightGrams;
    }
    if(p.lowStockKg === undefined){
      p.lowStockKg = p.lowStockGrams !== undefined ? p.lowStockGrams / 1000 : 1;
      delete p.lowStockGrams;
    }
    if(p.stockKg === undefined) p.stockKg = 0;
    if(p.refWeightKg === undefined) p.refWeightKg = 1;
    if(p.refPrice === undefined) p.refPrice = 0;
  });
  state.cart.forEach(c=>{
    if(c.weightGrams !== undefined && c.weightKg === undefined){
      c.weightKg = c.weightGrams / 1000;
      delete c.weightGrams;
    }
  });
  state.sales.forEach(s=>{
    (s.items||[]).forEach(it=>{
      if(it.weightGrams !== undefined && it.weightKg === undefined){
        it.weightKg = it.weightGrams / 1000;
        delete it.weightGrams;
      }
    });
  });
}

async function loadData(){
  const splashStart = Date.now();
  try{
    if(window.storage){
      const r = await window.storage.get('shop-data', false);
      if(r && r.value) applyLoadedData(JSON.parse(r.value));
    } else {
      const raw = localStorage.getItem('shop-data');
      if(raw) applyLoadedData(JSON.parse(raw));
    }
  }catch(e){
    // no data yet, start fresh
  }
  if(!state.domainsSeeded){
    state.domains = ['Produits alimentaires vivriers et cosmétiques','Produits pharmaceutiques','Matériaux de construction'];
    state.domainsSeeded = true;
  }
  if(!state.trialStart){
    state.trialStart = new Date().toISOString();
    await saveData();
  }
  ready = true;
  updateHeader();
  const reveal = ()=>{
    const splash = document.getElementById('splashScreen');
    if(splash) splash.style.display = 'none';
    if(isAppLocked()){ showPaywall(); return; }
    if(state.pin){ locked = true; showLock(); }
    else { render(); }
  };
  const elapsed = Date.now() - splashStart;
  setTimeout(reveal, Math.max(0, 900 - elapsed));
}

/**
 * Persiste tout l'état durable (hors panier) en un seul appel.
 * Appelée après chaque mutation qui doit survivre à une fermeture
 * de l'appli — c'est la seule fonction qui écrit dans le stockage.
 */
async function saveData(){
  try{
    const payload = JSON.stringify({
      products: state.products, sales: state.sales, credits: state.credits, pin: state.pin,
      expenses: state.expenses, employees: state.employees, salaryEntries: state.salaryEntries,
      company: state.company, reportPhone: state.reportPhone, autoReport: state.autoReport,
      templateUsage: state.templateUsage, trialStart: state.trialStart,
      licensePhone: state.licensePhone, licenseCode: state.licenseCode,
      domains: state.domains, domainsSeeded: state.domainsSeeded,
      suppliers: state.suppliers, purchases: state.purchases, language: state.language, translations: state.translations,
      adjustments: state.adjustments, sellers: state.sellers, activeSeller: state.activeSeller
    });
    if(window.storage){ await window.storage.set('shop-data', payload, false); }
    else { localStorage.setItem('shop-data', payload); }
  }catch(e){
    toast('⚠️ Sauvegarde impossible, réessaie');
  }
}

/* ============================== MODALES & TOASTS ============================== */
/* Un seul système générique : openModal(html) / closeModal() pour toutes
   les fenêtres (formulaires, confirmations, fiches détail...). */

function toast(msg){
  const root = document.getElementById('toastRoot');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(()=>el.remove(), 2200);
}

function openModal(html){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="overlay" id="overlayEl"><div class="modal">${html}</div></div>`;
  document.getElementById('overlayEl').addEventListener('click', (e)=>{
    if(e.target.id === 'overlayEl') closeModal();
  });
}
function closeModal(){
  if(barcodeDetectorLoop){ clearInterval(barcodeDetectorLoop); barcodeDetectorLoop = null; }
  if(barcodeStream){ barcodeStream.getTracks().forEach(t=>t.stop()); barcodeStream = null; }
  document.getElementById('modalRoot').innerHTML = '';
}

/**
 * Composant partagé : liste de clients à crédit filtrée par recherche,
 * avec option de créer un nouveau client à la volée. Réutilisé à la
 * fois pour choisir un client lors d'une vente à crédit (Vente) et
 * pour enregistrer un crédit manuel (Crédits) — seule l'action au tap
 * change, via les callbacks onPick/onCreate.
 * @param {string} containerId - id de l'élément où injecter la liste
 * @param {string} query - texte de recherche courant
 * @param {(clientId:string)=>string} onPick - retourne le JS à exécuter au tap sur un client existant
 * @param {(escapedName:string)=>string} onCreate - retourne le JS à exécuter au tap sur "nouveau client"
 */
function renderPersonPicker(containerId, query, onPick, onCreate){
  const list = document.getElementById(containerId);
  const nq = norm(query);
  const matches = state.credits.filter(c=>norm(c.name).includes(nq));
  let html = '<div class="card" style="padding:0;">';
  matches.forEach(c=>{
    html += `<div class="ledger-row" onclick="${onPick(c.id)}" style="cursor:pointer;">
      <div class="row-main">
        <div class="row-title">${escapeHtml(c.name)}</div>
        <div class="row-sub">Doit déjà ${money(c.balance)}</div>
      </div>
      <div class="row-right">›</div>
    </div>`;
  });
  if(query.trim() && !state.credits.find(c=>norm(c.name)===nq)){
    const safeName = escapeHtml(query.trim());
    html += `<div class="ledger-row" onclick="${onCreate(safeName)}" style="cursor:pointer;">
      <div class="row-main">
        <div class="row-title">+ Nouveau client « ${safeName} »</div>
      </div>
      <div class="row-right">›</div>
    </div>`;
  }
  if(matches.length===0 && !query.trim()){
    html += `<div class="empty" style="padding:20px;"><div class="msg">Tape le nom du client pour le chercher ou en créer un nouveau.</div></div>`;
  }
  html += '</div>';
  list.innerHTML = html;
}

function showLock(){
  document.getElementById('app').style.display = 'none';
  const el = document.getElementById('lockScreen');
  el.style.display = 'flex';
  pinBuffer = '';
  el.innerHTML = `
    <div class="brand">🔒 Caisse Simple</div>
    <div class="hint">Entre ton code PIN</div>
    <div class="pindots" id="pindots">${[0,1,2,3].map(()=>`<div class="d"></div>`).join('')}</div>
    <div class="keypad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="pinKey('${n}')">${n}</button>`).join('')}
      <div></div>
      <button onclick="pinKey('0')">0</button>
      <button onclick="pinKey('del')">⌫</button>
    </div>
  `;
}
function updateLockDots(){
  document.querySelectorAll('#pindots .d').forEach((d,i)=>{
    d.classList.toggle('filled', i < pinBuffer.length);
  });
}
function pinKey(k){
  if(k === 'del'){ pinBuffer = pinBuffer.slice(0,-1); }
  else if(pinBuffer.length < 4){ pinBuffer += k; }
  updateLockDots();
  if(pinBuffer.length === 4){
    if(pinBuffer === state.pin){
      locked = false;
      document.getElementById('lockScreen').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
      render();
    } else {
      toast('⚠️ Code incorrect');
      setTimeout(()=>{ pinBuffer=''; updateLockDots(); }, 300);
    }
  }
}

/**
 * Redimensionne et compresse une image sélectionnée par l'utilisateur
 * avant de la stocker (les photos de téléphone sont souvent trop
 * lourdes pour être gardées telles quelles dans le stockage de l'appli).
 * @param {File} file
 * @param {number} maxDim - largeur/hauteur maximale en pixels
 * @returns {Promise<string>} une image encodée en data URL JPEG
 */
function resizeImage(file, maxDim){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          const scale = maxDim / Math.max(w, h);
          w = Math.round(w*scale); h = Math.round(h*scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ============================== RAPPORTS WHATSAPP (SUIVI À DISTANCE) ============================== */
/**
 * Ouvre WhatsApp avec un message pré-rempli adressé au numéro de
 * l'employeur. Ne fait rien silencieusement si aucun numéro n'est
 * configuré — l'appel est sans risque même si la fonctionnalité
 * n'est pas activée.
 */
function sendWhatsAppReport(text){
  if(!state.reportPhone) return;
  const digits = state.reportPhone.replace(/[^0-9]/g, '');
  if(!digits) return;
  const url = `https://wa.me/${digits}?text=${encodeURIComponent(text)}`;
  window.open(url, '_blank');
}

/**
 * Envoie automatiquement un mouvement à l'employeur si le suivi
 * automatique est activé et qu'un numéro est configuré. Appelée
 * juste après chaque saveData() qui suit une vente, un paiement,
 * une dépense ou un mouvement de salaire.
 */
function autoReportMovement(line){
  if(!state.autoReport || !state.reportPhone) return;
  const co = state.company && state.company.name ? state.company.name : 'Caisse Simple';
  const when = new Date().toLocaleString('fr-FR', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
  sendWhatsAppReport(`🧾 ${co}\n${line}\n${when}`);
}

/**
 * Alerte quand un produit (ou un poids précis) vient de tomber à 0
 * pendant une vente — toast immédiat, et message WhatsApp si le
 * suivi automatique est activé, pour que le propriétaire le sache
 * même en déplacement.
 */
function alertStockDepleted(names){
  if(!names || names.length===0) return;
  setTimeout(()=> toast(`🔴 Stock épuisé : ${names.join(', ')}`), 1400);
  if(state.autoReport && state.reportPhone){
    const co = state.company && state.company.name ? state.company.name : 'Caisse Simple';
    const when = new Date().toLocaleString('fr-FR', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
    sendWhatsAppReport(`🧾 ${co}\n🔴 Stock épuisé : ${names.join(', ')}\n${when}`);
  }
}

 * Compose et envoie un résumé des ventes, dépenses, crédits et
 * salaires du jour — utilisable à tout moment, indépendamment du
 * suivi automatique.
 */
function sendDailyReport(){
  if(!state.reportPhone){ toast('⚠️ Ajoute d\'abord ton numéro WhatsApp'); openReportSettingsModal(); return; }
  const now = new Date();
  const isSameDay = (d)=> d.toDateString() === now.toDateString();
  const salesToday = state.sales.filter(s=>isSameDay(new Date(s.date)));
  const totalToday = salesToday.reduce((a,s)=>a+s.total,0);
  const mk = curMonthKey();
  const expToday = state.expenses.filter(e=>isSameDay(new Date(e.date))).reduce((a,e)=>a+e.amount,0);
  const co = state.company && state.company.name ? state.company.name : 'Caisse Simple';
  const lines = [
    `🧾 ${co} — Rapport du ${now.toLocaleDateString('fr-FR')}`,
    `Ventes : ${money(totalToday)} (${salesToday.length})`,
    `Dépenses : ${money(expToday)}`,
    `Crédits en cours : ${money(state.credits.reduce((a,c)=>a+c.balance,0))}`
  ];
  sendWhatsAppReport(lines.join('\n'));
}

    .filter(p => norm(p.name).includes(q))
    .sort((a,b)=>a.name.localeCompare(b.name));

  let rows = '';

    rows = `<div class="empty"><div class="big">🧾</div><div class="msg">Aucun produit encore.<br>Ajoute tes produits dans l'onglet Stock pour commencer à vendre.</div></div>`;
  } else if(list.length === 0){
    rows = `<div class="empty"><div class="msg">Aucun produit ne correspond à « ${venteSearch} ».</div></div>`;
  } else {
    rows = '<div class="card" style="padding:0;">' + list.map(p=>{
      if(p.sellByWeight){
        const cartCount = state.cart.filter(c=>c.id===p.id && c.weightKg).length;

        const pricePerKg = p.refPrice/p.refWeightKg;

          </div>
          <div class="row-right">
            ${cartCount>0 ? `<span class="badge gold">${cartCount} au panier</span>` : `<button class="btn btn-gold btn-sm" ${out?'disabled style="opacity:.35"':''}>Peser</button>`}
          </div>
        </div>`;
      }
      if(p.hasVariants){
        const cartQty = state.cart.filter(c=>c.id===p.id && (c.variantId||c.customVariant)).reduce((a,c)=>a+c.qty,0);
        const totalStock = p.variants.reduce((a,v)=>a+v.stock,0);
        const out = totalStock<=0;
        return `<div class="ledger-row" onclick="openVariantPicker('${p.id}')" style="cursor:pointer;">
          ${p.image ? `<img src="${p.image}" class="thumb" alt="">` : ''}
          <div class="row-main">
            <div class="row-title">${escapeHtml(p.name)}</div>
            <div class="row-sub">${p.variants.length} poids disponibles${out?' — épuisé':''}</div>
          </div>
          <div class="row-right">
            ${cartQty>0 ? `<span class="badge gold">${cartQty} au panier</span>` : `<button class="btn btn-gold btn-sm" ${out?'disabled style="opacity:.35"':''}>Choisir</button>`}
          </div>
        </div>`;
      }
      const inCart = state.cart.find(c=>c.id===p.id && !c.variantId);
      const qty = inCart ? inCart.qty : 0;
      const out = p.stock <= 0;
      return `<div class="ledger-row">
        ${p.image ? `<img src="${p.image}" class="thumb" alt="">` : ''}
        <div class="row-main">
          <div class="row-title">${escapeHtml(p.name)}</div>
          <div class="row-sub">${money(p.price)} · stock ${p.stock}${out?' — épuisé':''}</div>
        </div>
        <div class="row-right">
          ${qty>0 ? `
            <div class="stepper">
              <button onclick="cartChange('${p.id}',-1)">−</button>
              <div class="qty">${qty}</div>
              <button onclick="cartChange('${p.id}',1)" ${qty>=p.stock?'disabled style="opacity:.35"':''}>+</button>

      </div>`;
    }).join('') + '</div>';
  }

  main.innerHTML = `
    <div class="ledger-row" style="cursor:pointer; margin-bottom:12px;" onclick="openSellerPicker()">
      <div class="row-main">
        <div class="row-sub" style="margin:0;">Vendeur actif</div>

}

/* ============================== SCANNER DE CODE-BARRES ============================== */
/**
 * Utilise l'API native BarcodeDetector du navigateur (disponible sur
 * Chrome Android) — pas de librairie externe à charger, donc ça
 * fonctionne même hors connexion une fois l'appli installée. Le
 * scanner ouvre la caméra, détecte un code-barres, puis :
 *  - mode 'vente' : ajoute directement le produit correspondant au panier
 *  - mode 'form' : remplit le champ code-barres du formulaire produit
 */
let barcodeStream = null;
let barcodeDetectorLoop = null;

async function openBarcodeScanner(mode){
  if(!('BarcodeDetector' in window)){
    toast('⚠️ Le scanner n\'est pas supporté sur ce navigateur/téléphone');
    return;
  }
  openModal(`
    <div class="modal-handle"></div>
    <h3>📷 Scanner un code-barres</h3>
    <div style="border-radius:10px; overflow:hidden; background:#000; position:relative;">
      <video id="barcodeVideo" style="width:100%; display:block;" playsinline autoplay muted></video>
    </div>
    <div class="row-sub" style="margin-top:10px;" id="barcodeStatus">Vise le code-barres avec la caméra...</div>
    <div style="height:10px;"></div>
    <button class="btn btn-outline" onclick="closeBarcodeScanner()">Annuler</button>
  `);
  try{
    barcodeStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const video = document.getElementById('barcodeVideo');
    video.srcObject = barcodeStream;
    const detector = new BarcodeDetector();
    barcodeDetectorLoop = setInterval(async ()=>{
      try{
        const codes = await detector.detect(video);
        if(codes.length>0){
          onBarcodeDetected(codes[0].rawValue, mode);
        }
      }catch(e){ /* frame pas encore prête, on continue */ }
    }, 400);
  }catch(e){
    toast('⚠️ Impossible d\'accéder à la caméra');
    closeModal();
  }
}

function closeBarcodeScanner(){
  closeModal();
}

function onBarcodeDetected(code, mode){
  if(mode === 'form'){
    const field = document.getElementById('pBarcode');
    if(field) field.value = code;
    closeBarcodeScanner();
    toast('✅ Code-barres capturé');
    return;
  }
  // mode 'vente'
  const p = state.products.find(x=>x.barcode === code);
  closeBarcodeScanner();
  if(!p){
    toast('⚠️ Aucun produit avec ce code-barres');
    return;
  }
  if(p.hasVariants){
    render();
    openVariantPicker(p.id);
  } else {
    cartChange(p.id, 1);
    toast(`✅ ${p.name} ajouté au panier`);
  }
}

function cartChange(productId, delta){
  const p = state.products.find(x=>x.id===productId);
  if(!p) return;
  let item = state.cart.find(c=>c.id===productId && !c.variantId);
  if(!item){
    if(delta>0){ state.cart.push({key:p.id, id:p.id, variantId:null, name:p.name, price:p.price, cost:p.costPrice||0, domain:p.domain||'', qty:1}); }
  } else {
    item.qty += delta;
    if(item.qty > p.stock) item.qty = p.stock;
    if(item.qty <= 0){ state.cart = state.cart.filter(c=>c.key!==item.key); }
  }
  render();
}

/**
 * Ajoute/retire un poids précis d'un produit à variantes. Chaque poids
 * a sa propre ligne de panier (clé composite productId::variantId) et
 * son propre stock — le reste du parcours de vente (panier, validation,
 * décompte du stock) traite ensuite ces lignes exactement comme des
 * articles normaux, sans rien savoir des variantes.
 */
function cartChangeVariant(productId, variantId, delta){
  const p = state.products.find(x=>x.id===productId);
  if(!p) return;
  const v = p.variants.find(x=>x.id===variantId);
  if(!v) return;
  const key = productId+'::'+variantId;
  let item = state.cart.find(c=>c.key===key);
  if(!item){
    if(delta>0){ state.cart.push({key, id:p.id, variantId, name:`${p.name} (${v.label})`, price:v.price, cost:v.costPrice||0, domain:p.domain||'', qty:1}); }
  } else {
    item.qty += delta;
    if(item.qty > v.stock) item.qty = v.stock;
    if(item.qty <= 0){ state.cart = state.cart.filter(c=>c.key!==key); }
  }
  render();
}

/**
 * Ajoute/retire une "pesée" précise d'un produit vendu au poids. Le
 * prix est calculé automatiquement depuis le prix de référence
 * (ex: 500 FCFA les 0,5kg → 1000 FCFA/kg). Chaque poids distinct forme
 * sa propre ligne de panier (comme les poids/tailles fixes), et peut
 * ensuite être incrémenté normalement si on pèse deux fois la même
 * quantité.
 */
function cartChangeWeight(productId, weightKg, delta){
  const p = state.products.find(x=>x.id===productId);
  if(!p || !p.sellByWeight) return;
  const key = productId+'::w'+weightKg;
  let item = state.cart.find(c=>c.key===key);
  const unitsAvailable = Math.floor(p.stockKg / weightKg);
  if(!item){
    if(delta>0){
      if(unitsAvailable<=0) return;
      const price = (p.refPrice/p.refWeightKg)*weightKg;
      const cost = p.costPerKg ? (p.costPerKg*weightKg) : 0;
      state.cart.push({key, id:p.id, weightKg, name:`${p.name} (${weightKg}kg)`, price, cost, domain:p.domain||'', qty:1});
    }
  } else {
    item.qty += delta;
    if(item.qty > unitsAvailable) item.qty = unitsAvailable;
    if(item.qty <= 0){ state.cart = state.cart.filter(c=>c.key!==key); }
  }
  render();
}

function confirmWeightSale(productId){
  const kg = parseFloat(document.getElementById('weightSaleKg').value);
  if(isNaN(kg) || kg<=0){ toast('⚠️ Entre un poids valide'); return; }
  const p = state.products.find(x=>x.id===productId);
  const already = state.cart.filter(c=>c.id===productId && c.weightKg).reduce((a,c)=>a+c.weightKg*c.qty,0);
  if(already+kg > p.stockKg){ toast('⚠️ Stock insuffisant pour ce poids'); return; }
  cartChangeWeight(productId, kg, 1);
  document.getElementById('weightSaleKg').value = '';
  document.getElementById('weightSalePreview').textContent = '';
  refreshWeightSaleModal(productId);
}

/** Dispatch générique utilisé par le panier : route vers la bonne fonction selon que la ligne est un poids, une variante ou un produit simple. */
function cartChangeByKey(key, delta){
  const item = state.cart.find(c=>c.key===key);
  if(!item) return;
  if(item.customVariant){ cartChangeCustomWeight(key, delta); }
  else if(item.weightKg){ cartChangeWeight(item.id, item.weightKg, delta); }
  else if(item.variantId){ cartChangeVariant(item.id, item.variantId, delta); }
  else { cartChange(item.id, delta); }
}

/**
 * Essaie de déduire un prix au kilo à partir des poids déjà définis
 * sur le produit (ex: si "1kg" coûte 1000 FCFA, on en déduit
 * 1000 FCFA/kg). Ne fonctionne que si au moins un poids existant a un
 * libellé numérique reconnaissable ("1kg", "500g", "0.5 kg"...) —
 * sinon retourne null et le prix reste à saisir manuellement.
 */
function parseWeightLabelToKg(label){
  const s = (label||'').trim().toLowerCase().replace(',', '.');
  let m = s.match(/^(\d+(?:\.\d+)?)\s*kg$/);
  if(m) return parseFloat(m[1]);
  m = s.match(/^(\d+(?:\.\d+)?)\s*g$/);
  if(m) return parseFloat(m[1]) / 1000;
  return null;
}

function inferPricePerKg(p){
  for(const v of p.variants){
    const kg = parseWeightLabelToKg(v.label);
    if(kg && kg > 0) return v.price / kg;
  }
  return null;
}

function openCustomWeightModal(productId){
  const p = state.products.find(x=>x.id===productId);
  const rate = inferPricePerKg(p);
  openModal(`
    <div class="modal-handle"></div>
    <h3>Poids personnalisé</h3>
    <div class="row-sub" style="margin-bottom:12px;">${escapeHtml(p.name)} — un poids en dehors des options prédéfinies. Le stock n'est pas décompté automatiquement pour cette ligne : pense à l'ajuster ensuite si besoin (Stock → Ajuster après comptage).</div>
    <label>Poids (kg)</label>
    <input type="number" step="0.01" id="customWeightKg" placeholder="Ex: 0.8" oninput="updateCustomWeightPrice('${p.id}')">
    ${rate ? `<div class="row-sub" style="margin-top:6px;">Prix déduit automatiquement : ${money(rate)}/kg (d'après un poids déjà enregistré)</div>` : ''}
    <label>Description (optionnel)</label>
    <input type="text" id="customWeightLabel" placeholder="Ex: découpe spéciale">
    <label>Prix (FCFA)</label>
    <input type="number" id="customWeightPrice" placeholder="${rate?'Calculé automatiquement, modifiable si besoin':'Ex: 750'}">
    <div style="height:16px;"></div>
    <button class="btn btn-gold" onclick="confirmCustomWeight('${p.id}')">Ajouter au panier</button>
  `);
}

function updateCustomWeightPrice(productId){
  const p = state.products.find(x=>x.id===productId);
  const rate = inferPricePerKg(p);
  if(!rate) return;
  const kg = parseFloat(document.getElementById('customWeightKg').value);
  if(isNaN(kg) || kg<=0) return;
  document.getElementById('customWeightPrice').value = Math.round(rate*kg);
}

async function confirmCustomWeight(productId){
  const kg = parseFloat(document.getElementById('customWeightKg').value);
  const labelInput = document.getElementById('customWeightLabel').value.trim();
  const price = parseFloat(document.getElementById('customWeightPrice').value);
  if(isNaN(kg) || kg<=0){ toast('⚠️ Entre un poids valide'); return; }
  if(isNaN(price) || price<=0){ toast('⚠️ Entre un prix valide (ou renseigne un poids déjà connu pour le calcul automatique)'); return; }
  const label = labelInput || `${kg}kg`;
  const p = state.products.find(x=>x.id===productId);
  state.cart.push({key: uid(), id:p.id, variantId:null, customVariant:true, name:`${p.name} (${label})`, price, cost:0, domain:p.domain||'', qty:1});

/**
 * Valide le panier courant en une vente : vérifie le stock, décrémente
 * les quantités, crée l'entrée dans `sales`, et si type==='credit',
 * crée le client si besoin et augmente son solde dû.
 */
async function finalizeSale(type, clientId, newClientName, provider, newClientPhone){
  // stock check
  for(const item of state.cart){
    const p = state.products.find(x=>x.id===item.id);
    if(!p){ toast('⚠️ Stock insuffisant pour ' + item.name); return; }
    if(item.customVariant) continue;
    if(item.weightKg){
      if(item.weightKg*item.qty > p.stockKg){ toast('⚠️ Stock insuffisant pour ' + item.name); return; }
      continue;
    }
    const stockAvailable = item.variantId ? (p.variants.find(v=>v.id===item.variantId)||{}).stock : p.stock;
    if(stockAvailable === undefined || item.qty > stockAvailable){ toast('⚠️ Stock insuffisant pour ' + item.name); return; }
  }
  const total = state.cart.reduce((a,c)=>a+c.qty*c.price,0);
  let client = null;
  if(type === 'credit'){
    if(clientId){ client = state.credits.find(c=>c.id===clientId); }
    else {
      client = { id: uid(), name: newClientName, phone: newClientPhone||'', balance:0, history:[] };
      state.credits.push(client);
    }
  }
  // apply stock
  const depleted = [];
  state.cart.forEach(item=>{
    const p = state.products.find(x=>x.id===item.id);
    if(item.customVariant){
      // pas de stock associé — ligne informationnelle uniquement
    } else if(item.weightKg){
      p.stockKg -= item.weightKg*item.qty;
      if(p.stockKg<=0) depleted.push(p.name);
    } else if(item.variantId){
      const v = p.variants.find(x=>x.id===item.variantId);
      if(v){ v.stock -= item.qty; if(v.stock<=0) depleted.push(`${p.name} (${v.label})`); }
    } else {
      p.stock -= item.qty;
      if(p.stock<=0) depleted.push(p.name);
    }
  });
  const sale = {
    id: uid(), date: new Date().toISOString(), items: state.cart.map(c=>({...c})),
    total, type, provider: provider || null, clientId: client ? client.id : null, clientName: client ? client.name : null,
    seller: state.activeSeller || ''
  };
  state.sales.push(sale);
  if(client){
    client.balance += total;
    client.history.push({date: sale.date, type:'vente', amount: total, note: 'Achat'});
  }
  state.cart = [];
  await saveData();
  render();
  toast(type==='credit' ? `✅ Vente à crédit enregistrée pour ${client.name}` : type==='mobilemoney' ? `✅ Vente enregistrée (${provider})` : '✅ Vente enregistrée');
  autoReportMovement(type==='credit'
    ? `Vente à crédit : ${money(total)} — ${client.name}`
    : type==='mobilemoney'
      ? `Vente : ${money(total)} (${provider})`
      : `Vente : ${money(total)} (cash)`);
  alertStockDepleted(depleted);
  openReceiptModal(sale);
}

/* ============================== MODÈLES DE PRODUITS ============================== */
/**
 * Liste de référence de produits courants dans les petits commerces
 * togolais, groupés par catégorie, pour éviter de tout retaper à la
 * main. Purement statique — ne fait pas partie de `state` — seule la
 * fréquence d'utilisation (templateUsage) est persistée, pour faire
 * remonter les modèles les plus utilisés en tête de liste ("par préférence").
 */
const PRODUCT_TEMPLATES = {
  'Alimentation': ['Riz','Sucre','Huile végétale','Farine de maïs','Farine de blé','Spaghetti','Tomate en boîte','Sardine en boîte','Lait concentré','Sel','Piment sec','Oignon','Ail','Œufs','Pain','Biscuits','Bonbons','Cube Maggi','Café soluble','Thé'],
  'Boissons': ['Eau minérale (sachet)','Eau minérale (bouteille)','Boisson gazeuse','Bière','Jus en sachet','Yaourt à boire'],
  'Hygiène & beauté': ['Savon de toilette','Savon Omo / lessive','Pâte dentifrice','Brosse à dents','Papier hygiénique','Crème corporelle','Rasoir jetable'],
  'Ménage & maison': ['Bougie','Allumettes','Pile','Sac plastique','Éponge','Eau de Javel'],
  'Divers': ['Recharge téléphone','Carte SIM','Cigarette à l\'unité','Chewing-gum','Mouchoirs']
};

/* ============================== IMPORT EN MASSE DE PRODUITS ============================== */
/**
 * Ajoute plusieurs produits d'un coup à partir d'un texte collé
 * (une ligne par produit), au lieu de remplir le formulaire un par
 * un. Format simple et tolérant : Nom, Prix de vente, Stock, et en
 * option Prix d'achat en 4ᵉ colonne. Les lignes mal formées sont
 * ignorées et signalées, sans bloquer l'import des lignes valides.
 */
function openBulkImportModal(){
  openModal(`
    <div class="modal-handle"></div>
    <h3>Importer plusieurs produits</h3>
    <div class="row-sub" style="margin-bottom:10px;">Une ligne par produit, séparée par des virgules :<br><b>Nom, Prix de vente, Stock</b> (Prix d'achat optionnel en 4ᵉ colonne)</div>
    <textarea id="bulkImportText" rows="8" style="width:100%; padding:11px 12px; border-radius:8px; border:1px solid var(--line); background:var(--cream); font-size:14px; font-family:inherit; color:var(--ink);" placeholder="Riz, 500, 20&#10;Sucre, 350, 15, 280&#10;Savon Palmida, 400, 30"></textarea>
    <div style="height:16px;"></div>
    <button class="btn btn-gold" onclick="runBulkImport()">Importer</button>
  `);
}

async function runBulkImport(){
  const raw = document.getElementById('bulkImportText').value;
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  if(lines.length===0){ toast('⚠️ Colle au moins une ligne'); return; }
  let added = 0;
  const errors = [];
  lines.forEach((line, i)=>{
    const parts = line.split(',').map(s=>s.trim());
    const name = parts[0];
    const price = parseFloat(parts[1]);
    const stock = parseInt(parts[2], 10);
    const costPrice = parts[3] ? parseFloat(parts[3]) : 0;
    if(!name || isNaN(price) || isNaN(stock)){
      errors.push(`Ligne ${i+1} : "${line}"`);
      return;
    }
    state.products.push({id: uid(), name, domain:'', price, costPrice: isNaN(costPrice)?0:costPrice, stock, lowStock: LOW_STOCK, hasVariants:false, image:''});
    added++;
  });
  if(added>0){
    await saveData();
    render();
  }
  closeModal();
  if(errors.length>0){
    toast(`✅ ${added} produit(s) ajouté(s) — ${errors.length} ligne(s) ignorée(s)`);
  } else {
    toast(`✅ ${added} produit(s) ajouté(s)`);
  }
}

/** Affiche les modèles filtrés, triés par usage décroissant dans chaque catégorie. */
function renderTemplatesList(query){
  const list = document.getElementById('templatesList');
  const nq = norm(query);
  let html = '';
  Object.entries(PRODUCT_TEMPLATES).forEach(([category, items])=>{
    const matches = items
      .filter(name=>norm(name).includes(nq))
      .sort((a,b)=> (state.templateUsage[norm(b)]||0) - (state.templateUsage[norm(a)]||0));
    if(matches.length===0) return;
    html += `<h2 class="section-title" style="margin-top:14px;">${escapeHtml(category)}</h2>`;
    html += '<div class="card" style="padding:0;">' + matches.map(name=>{
      const used = state.templateUsage[norm(name)] > 0;
      return `<div class="ledger-row" onclick="openNewProductFromTemplate('${escapeHtml(name)}')" style="cursor:pointer;">
        <div class="row-main"><div class="row-title">${escapeHtml(name)}</div></div>
        <div class="row-right">${used ? '<span class="badge gold">déjà utilisé</span>' : ''}</div>
      </div>`;
    }).join('') + '</div>';
  });
  list.innerHTML = html || `<div class="empty" style="padding:20px;"><div class="msg">Aucun modèle ne correspond à « ${escapeHtml(query)} ».</div></div>`;
}

let stockSearch = '';
let stockSubTab = 'produits';

function renderStock(){
  const main = document.getElementById('main');
  const subNav = `
    <div style="display:flex; gap:6px; margin-bottom:14px;">
      <button class="btn btn-sm ${stockSubTab==='produits'?'btn-gold':'btn-outline'}" style="flex:1;" onclick="stockSubTab='produits'; renderStock();">Produits</button>
      <button class="btn btn-sm ${stockSubTab==='domaines'?'btn-gold':'btn-outline'}" style="flex:1;" onclick="stockSubTab='domaines'; renderStock();">Domaines</button>
      <button class="btn btn-sm ${stockSubTab==='fournisseurs'?'btn-gold':'btn-outline'}" style="flex:1;" onclick="stockSubTab='fournisseurs'; renderStock();">Fournisseurs</button>
    </div>
  `;
  if(stockSubTab === 'domaines'){
    main.innerHTML = subNav;
    renderStockDomains();
    return;
  }
  if(stockSubTab === 'fournisseurs'){
    main.innerHTML = subNav;
    renderStockSuppliers();
    return;
  }

  const q = norm(stockSearch);
  const list = state.products.filter(p=>norm(p.name).includes(q)).sort((a,b)=>a.name.localeCompare(b.name));

  let rows = '';
  if(state.products.length===0){
    rows = `<div class="empty"><div class="big">📦</div><div class="msg">Aucun produit.<br>Ajoute ton premier produit pour commencer.</div></div>`;
  } else if(list.length===0){
    rows = `<div class="empty"><div class="msg">Aucun résultat pour « ${stockSearch} ».</div></div>`;
  } else {
    rows = '<div class="card" style="padding:0;">' + list.map(p=>{
      if(p.sellByWeight){
        const low = p.stockKg <= (p.lowStockKg||1);
        const pricePerKg = p.refPrice/p.refWeightKg;
        return `<div class="ledger-row" onclick="openProductModal('${p.id}')" style="cursor:pointer;">
          ${p.image ? `<img src="${p.image}" class="thumb" alt="">` : ''}
          <div class="row-main">
            <div class="row-title">${escapeHtml(p.name)}</div>
            <div class="row-sub">${money(pricePerKg)}/kg · vente au poids${p.domain?' · '+escapeHtml(p.domain):''}${expiryBadge(p.expiryDate)}</div>
          </div>
          <div class="row-right">
            <span class="badge ${low?'low':''}">${p.stockKg.toFixed(2)}kg</span>
          </div>
        </div>`;
      }
      if(p.hasVariants){
        const totalStock = p.variants.reduce((a,v)=>a+v.stock,0);
        const anyLow = p.variants.some(v=>v.stock <= ((v.lowStock===undefined||v.lowStock===null)?LOW_STOCK:v.lowStock));
        const nearestExpiry = p.variants.map(v=>v.expiryDate).filter(Boolean).sort()[0];
        return `<div class="ledger-row" onclick="openProductModal('${p.id}')" style="cursor:pointer;">
          ${p.image ? `<img src="${p.image}" class="thumb" alt="">` : ''}
          <div class="row-main">
            <div class="row-title">${escapeHtml(p.name)}</div>
            <div class="row-sub">${p.variants.length} poids/tailles${p.domain?' · '+escapeHtml(p.domain):''}${expiryBadge(nearestExpiry)}</div>
          </div>
          <div class="row-right">
            <span class="badge ${anyLow?'low':''}">${totalStock} en stock (total)</span>
          </div>
        </div>`;
      }
      const threshold = (p.lowStock === undefined || p.lowStock === null) ? LOW_STOCK : p.lowStock;
      const low = p.stock <= threshold;
      return `<div class="ledger-row" onclick="openProductModal('${p.id}')" style="cursor:pointer;">
        ${p.image ? `<img src="${p.image}" class="thumb" alt="">` : ''}
        <div class="row-main">
          <div class="row-title">${escapeHtml(p.name)}</div>
          <div class="row-sub">${money(p.price)} · alerte à ≤ ${threshold}${p.domain?' · '+escapeHtml(p.domain):''}${expiryBadge(p.expiryDate)}</div>
        </div>
        <div class="row-right">
          <span class="badge ${low?'low':''}">${p.stock} en stock</span>
        </div>
      </div>`;
    }).join('') + '</div>';
  }

  main.innerHTML = subNav + `
    <div class="search-wrap">
      <span class="icon">🔍</span>
      <input type="text" id="stockSearchInput" placeholder="Chercher un produit..." value="${escapeHtml(stockSearch)}" oninput="stockSearch=this.value; renderStock(); refocusSearch('stockSearchInput');">
    </div>
    ${state.products.length>0 ? `<div class="row-sub" style="margin:-4px 0 10px;">Touche un produit pour le modifier ou le retirer.</div>` : ''}
    ${rows}

/** Agrège achats/ventes/marge par domaine, à partir des lignes de vente sur la période choisie. */
function computeDomainReport(type){
  const {start, end, label} = periodRange(type);
  const inRange = (d)=>{ const dt = new Date(d); return dt >= start && dt <= end; };
  const sales = state.sales.filter(s=>inRange(s.date));
  const buckets = {};
  const ensure = (name)=>{ if(!buckets[name]) buckets[name] = {name, achats:0, ventes:0}; return buckets[name]; };
  state.domains.forEach(d=>ensure(d));
  sales.forEach(s=>s.items.forEach(it=>{
    const b = ensure(it.domain || 'Non classé');
    b.ventes += it.price * it.qty;
    b.achats += (it.cost||0) * it.qty;
  }));
  const rows = Object.values(buckets)
    .filter(b=> b.ventes>0 || b.achats>0 || state.domains.includes(b.name))
    .map(b=>({...b, marge: b.ventes - b.achats}));
  const totalAchats = rows.reduce((a,r)=>a+r.achats,0);
  const totalVentes = rows.reduce((a,r)=>a+r.ventes,0);
  const totalMarge = totalVentes - totalAchats;
  return {label, start, end, rows, totalAchats, totalVentes, totalMarge};
}

/** Affiche le sélecteur de poids (variantes fixes) ou adapte le libellé de quantité (vente au poids). */
function onPurchaseProductChange(){
  const productId = document.getElementById('purProduct').value;
  const wrap = document.getElementById('purVariantWrap');
  const qtyLabel = document.getElementById('purQtyLabel');
  const p = state.products.find(x=>x.id===productId);
  if(p && p.hasVariants){
    document.getElementById('purVariant').innerHTML = p.variants.map(v=>`<option value="${v.id}">${escapeHtml(v.label)}</option>`).join('');
    wrap.style.display = '';
    qtyLabel.textContent = 'Quantité achetée';
  } else if(p && p.sellByWeight){
    wrap.style.display = 'none';
    qtyLabel.textContent = 'Quantité achetée (kg) — ex: 10 pour un carton de 10kg';
  } else {
    wrap.style.display = 'none';
    qtyLabel.textContent = 'Quantité achetée';
  }
  updatePurchasePreview();
}

function updatePurchasePreview(){
  const productId = document.getElementById('purProduct').value;
  const p = state.products.find(x=>x.id===productId);
  const qty = parseFloat(document.getElementById('purQty').value);
  const total = parseFloat(document.getElementById('purTotal').value);
  const el = document.getElementById('purPreview');
  if(!p || !p.sellByWeight || isNaN(qty) || qty<=0 || isNaN(total) || total<=0){ el.textContent = ''; return; }
  el.textContent = `= ${money(total/qty)} / kg`;
}

async function savePurchase(){
  const supplierId = document.getElementById('purSupplier').value || null;
  const productId = document.getElementById('purProduct').value;
  const qty = parseFloat(document.getElementById('purQty').value);
  const total = parseFloat(document.getElementById('purTotal').value);
  if(!productId){ toast('⚠️ Choisis un produit'); return; }
  if(isNaN(qty) || qty<=0 || isNaN(total) || total<=0){ toast('⚠️ Entre une quantité et un prix valides'); return; }
  const p = state.products.find(x=>x.id===productId);
  if(!p){ toast('⚠️ Produit introuvable'); return; }

  let variantId = null, variantLabel = '', displayName = p.name;
  if(p.sellByWeight){
    p.stockKg += qty;
    p.costPerKg = total/qty;
    displayName = `${p.name} (${qty}kg)`;
  } else if(p.hasVariants){
    variantId = document.getElementById('purVariant').value;
    const v = p.variants.find(x=>x.id===variantId);
    if(!v){ toast('⚠️ Choisis un poids'); return; }
    v.stock += Math.round(qty);
    variantLabel = v.label;
    displayName = `${p.name} (${v.label})`;
  } else {
    p.stock += Math.round(qty);
  }

  const supplier = supplierId ? state.suppliers.find(s=>s.id===supplierId) : null;
  state.purchases.push({
    id: uid(), date: new Date().toISOString(), supplierId: supplierId||null,
    supplierName: supplier ? supplier.name : '', productId, variantId, variantLabel,
    productName: displayName, qty, total
  });
  await saveData();
  closeModal();
  render();
  toast(`✅ Achat enregistré — stock de ${displayName} mis à jour`);
}

      <label>${p?'Stock actuel (kg)':'Stock initial (kg)'}</label>

    addVariantRow();
  }
}

/* ============================== AJUSTEMENT D'INVENTAIRE ============================== */
/**
 * Corrige le stock d'un produit après un comptage physique, en
 * gardant une trace de l'écart (contrairement à une simple
 * modification du chiffre dans la fiche produit). Utile pour tracer
 * les pertes, la casse, ou une erreur de comptage précédente.
 */
function openInventoryAdjustModal(productId){
  const p = state.products.find(x=>x.id===productId);
  if(!p) return;
  if(p.hasVariants){
    openModal(`
      <div class="modal-handle"></div>
      <h3>Ajuster après comptage</h3>
      <label>Poids / taille</label>
      <select id="adjVariant" style="width:100%; padding:11px 12px; border-radius:8px; border:1px solid var(--line); background:var(--cream); font-size:15px; font-family:inherit; color:var(--ink);">
        ${p.variants.map(v=>`<option value="${v.id}">${escapeHtml(v.label)} (stock actuel : ${v.stock})</option>`).join('')}
      </select>
      <label>Stock réel compté</label>
      <input type="number" id="adjCounted" placeholder="Ex: 17">
      <label>Motif (optionnel)</label>
      <input type="text" id="adjNote" placeholder="Ex: casse, vol, erreur de comptage...">
      <div style="height:16px;"></div>
      <button class="btn btn-gold" onclick="saveInventoryAdjustment('${p.id}')">Enregistrer l'ajustement</button>
    `);
  } else {
    openModal(`
      <div class="modal-handle"></div>
      <h3>Ajuster après comptage</h3>
      <div class="row-sub" style="margin-bottom:12px;">Stock actuel dans l'appli : <b>${p.stock}</b></div>
      <label>Stock réel compté</label>
      <input type="number" id="adjCounted" placeholder="Ex: 17">
      <label>Motif (optionnel)</label>
      <input type="text" id="adjNote" placeholder="Ex: casse, vol, erreur de comptage...">
      <div style="height:16px;"></div>
      <button class="btn btn-gold" onclick="saveInventoryAdjustment('${p.id}')">Enregistrer l'ajustement</button>
    `);
  }
}

async function saveInventoryAdjustment(productId){
  const p = state.products.find(x=>x.id===productId);
  if(!p) return;
  const counted = parseInt(document.getElementById('adjCounted').value, 10);
  const note = document.getElementById('adjNote').value.trim();
  if(isNaN(counted) || counted<0){ toast('⚠️ Entre un stock compté valide'); return; }

  let before, label = p.name;
  if(p.hasVariants){
    const variantId = document.getElementById('adjVariant').value;
    const v = p.variants.find(x=>x.id===variantId);
    if(!v) return;
    before = v.stock;
    v.stock = counted;
    label = `${p.name} (${v.label})`;
    state.adjustments.push({id: uid(), date: new Date().toISOString(), productId, variantId, productName: label, before, after: counted, delta: counted-before, note});
  } else {
    before = p.stock;
    p.stock = counted;
    state.adjustments.push({id: uid(), date: new Date().toISOString(), productId, variantId: null, productName: label, before, after: counted, delta: counted-before, note});
  }
  await saveData();
  closeModal();
  render();
  const delta = counted - before;
  toast(delta===0 ? '✅ Stock confirmé, aucun écart' : `✅ Ajusté : ${delta>0?'+':''}${delta} (${label})`);
}

/** Historique des ajustements d'inventaire, du plus récent au plus ancien. */
function openAdjustmentsHistory(){
  const rows = state.adjustments.slice().reverse().slice(0,100).map(a=>`
    <div class="ledger-row">
      <div class="row-main">
        <div class="row-title">${escapeHtml(a.productName)}</div>
        <div class="row-sub">${new Date(a.date).toLocaleDateString('fr-FR')}${a.note?' · '+escapeHtml(a.note):''}</div>
      </div>
      <div class="row-right">
        <span class="price" style="color:${a.delta<0?'var(--terracotta)':a.delta>0?'var(--green)':'inherit'}">${a.delta>0?'+':''}${a.delta}</span>
      </div>
    </div>`).join('');
  openModal(`
    <div class="modal-handle"></div>
    <h3>Historique des ajustements</h3>
    <div class="card" style="padding:0;">${rows || '<div class="empty" style="padding:18px;"><div class="msg">Aucun ajustement enregistré.</div></div>'}</div>
  `);
}

/** Une "ligne poids" éditable dans le formulaire produit (label, prix, coût, stock, seuil). */

  return `
    <div class="card" data-variant-row="${vid}" style="margin-bottom:8px;">
      <div style="display:flex; gap:8px; align-items:flex-end;">
        <div style="flex:1;">
          <label style="margin-top:0;">Poids / taille</label>
          <input type="text" class="v-label" value="${v?escapeHtml(v.label):''}" placeholder="Ex: 1kg">
        </div>
        <button type="button" class="btn btn-danger btn-sm" onclick="this.closest('[data-variant-row]').remove()">✕</button>
      </div>
      <div style="display:flex; gap:8px;">
        <div style="flex:1;"><label>Prix de vente</label><input type="number" class="v-price" value="${v?v.price:''}" placeholder="Ex: 500"></div>
        <div style="flex:1;"><label>Prix d'achat</label><input type="number" class="v-cost" value="${v&&v.costPrice?v.costPrice:''}" placeholder="Ex: 350"></div>
      </div>
      <div style="display:flex; gap:8px;">
        <div style="flex:1;"><label>Stock</label><input type="number" class="v-stock" value="${v?v.stock:''}" placeholder="Ex: 20"></div>
        <div style="flex:1;"><label>Seuil bas</label><input type="number" class="v-lowstock" value="${v&&v.lowStock!=null?v.lowStock:LOW_STOCK}" placeholder="Ex: 5"></div>
      </div>
      <label>Date de péremption <span style="font-weight:400; opacity:.7;">— facultative</span></label>

}

function addVariantRow(){
  const container = document.getElementById('variantRows');
  const wrap = document.createElement('div');
  wrap.innerHTML = variantRowHtml(null);
  container.appendChild(wrap.firstElementChild);
}

function toggleProductType(type){
  document.getElementById('simpleFields').style.display = type==='simple' ? '' : 'none';
  document.getElementById('variantFields').style.display = type==='variants' ? '' : 'none';
  document.getElementById('weightFields').style.display = type==='weight' ? '' : 'none';
  if(type==='variants' && document.getElementById('variantRows').children.length===0){
    addVariantRow();
  }
}

async function saveProduct(id){
  const name = document.getElementById('pName').value.trim();
  const domain = document.getElementById('pDomain').value;
  const barcode = document.getElementById('pBarcode').value.trim();
  const pType = document.getElementById('pType').value;
  if(!name){ toast('⚠️ Le nom du produit est obligatoire'); return; }

  // Photo : undefined = ne rien changer, '' = retirer, sinon nouvelle image compressée.
  let imageData;
  const imageFile = document.getElementById('pImageFile').files[0];
  const removeImageEl = document.getElementById('pImageRemove');
  if(imageFile){
    try{ imageData = await resizeImage(imageFile, 400); }
    catch(e){ toast('⚠️ Photo illisible, réessaie'); return; }
  } else if(removeImageEl && removeImageEl.checked){
    imageData = '';
  }

  if(pType==='variants'){
    const rows = Array.from(document.querySelectorAll('#variantRows [data-variant-row]'));
    if(rows.length===0){ toast('⚠️ Ajoute au moins un poids'); return; }
    const variants = [];
    for(const row of rows){
      const label = row.querySelector('.v-label').value.trim();
      const price = parseFloat(row.querySelector('.v-price').value);
      const costRaw = row.querySelector('.v-cost').value;
      const cost = costRaw === '' ? 0 : parseFloat(costRaw);
      const stock = parseInt(row.querySelector('.v-stock').value, 10);
      let lowStock = parseInt(row.querySelector('.v-lowstock').value, 10);
      if(isNaN(lowStock) || lowStock < 0) lowStock = LOW_STOCK;
      const expiryDate = row.querySelector('.v-expiry').value || '';
      if(!label || isNaN(price) || isNaN(stock)){ toast('⚠️ Remplis tous les champs de chaque poids'); return; }
      variants.push({id: row.dataset.variantRow, label, price, costPrice: cost, stock, lowStock, expiryDate});
    }
    if(id){
      const p = state.products.find(x=>x.id===id);
      p.name = name; p.domain = domain; p.barcode = barcode; p.hasVariants = true; p.sellByWeight = false; p.variants = variants;
      if(imageData !== undefined) p.image = imageData;
      delete p.price; delete p.stock; delete p.costPrice; delete p.lowStock;
      delete p.refPrice; delete p.refWeightKg; delete p.stockKg; delete p.costPerKg; delete p.lowStockKg;
    } else {
      state.products.push({id: uid(), name, domain, barcode, hasVariants: true, sellByWeight:false, variants, image: imageData || ''});
      const key = norm(name);
      state.templateUsage[key] = (state.templateUsage[key] || 0) + 1;
    }
  } else if(pType==='weight'){
    const refPrice = parseFloat(document.getElementById('pRefPrice').value);
    const refWeightKg = parseFloat(document.getElementById('pRefWeight').value);
    const costPerKgRaw = document.getElementById('pCostPerKg').value;
    const costPerKg = costPerKgRaw === '' ? 0 : parseFloat(costPerKgRaw);
    const stockKg = parseFloat(document.getElementById('pStockKg').value);
    let lowStockKg = parseFloat(document.getElementById('pLowStockKg').value);
    if(isNaN(lowStockKg) || lowStockKg < 0) lowStockKg = 1;
    const expiryDate = document.getElementById('pExpiryWeight').value || '';
    if(isNaN(refPrice) || refPrice<=0 || isNaN(refWeightKg) || refWeightKg<=0 || isNaN(stockKg)){ toast('⚠️ Remplis le prix, le poids de référence et le stock'); return; }
    if(id){
      const p = state.products.find(x=>x.id===id);
      p.name = name; p.domain = domain; p.barcode = barcode; p.hasVariants = false; p.sellByWeight = true;
      p.refPrice = refPrice; p.refWeightKg = refWeightKg; p.costPerKg = costPerKg; p.stockKg = stockKg; p.lowStockKg = lowStockKg; p.expiryDate = expiryDate;
      if(imageData !== undefined) p.image = imageData;
      delete p.price; delete p.stock; delete p.costPrice; delete p.lowStock; delete p.variants;
    } else {
      state.products.push({id: uid(), name, domain, barcode, hasVariants:false, sellByWeight:true, refPrice, refWeightKg, costPerKg, stockKg, lowStockKg, expiryDate, image: imageData || ''});
      const key = norm(name);
      state.templateUsage[key] = (state.templateUsage[key] || 0) + 1;
    }
  } else {
    const price = parseFloat(document.getElementById('pPrice').value);
    const costRaw = document.getElementById('pCost').value;
    const costPrice = costRaw === '' ? 0 : parseFloat(costRaw);
    const stock = parseInt(document.getElementById('pStock').value, 10);
    let lowStock = parseInt(document.getElementById('pLowStock').value, 10);
    if(isNaN(lowStock) || lowStock < 0) lowStock = LOW_STOCK;
    const expiryDate = document.getElementById('pExpiry').value || '';
    if(isNaN(price) || isNaN(stock)){ toast('⚠️ Remplis tous les champs'); return; }
    if(id){
      const p = state.products.find(x=>x.id===id);
      p.name = name; p.domain = domain; p.barcode = barcode; p.price = price; p.costPrice = costPrice; p.stock = stock; p.lowStock = lowStock; p.expiryDate = expiryDate;
      if(imageData !== undefined) p.image = imageData;
      p.hasVariants = false; p.sellByWeight = false; delete p.variants;
      delete p.refPrice; delete p.refWeightKg; delete p.stockKg; delete p.costPerKg; delete p.lowStockKg;
    } else {
      state.products.push({id: uid(), name, domain, barcode, price, costPrice, stock, lowStock, hasVariants:false, sellByWeight:false, image: imageData || '', expiryDate});
      const key = norm(name);
      state.templateUsage[key] = (state.templateUsage[key] || 0) + 1;
    }
  }
  await saveData();
  closeModal();
  render();
  toast('✅ Produit enregistré');
}

async function deleteProduct(id){
  state.products = state.products.filter(p=>p.id!==id);
  await saveData();
  closeModal();
  render();
  toast('🗑️ Produit supprimé');
}

/* ================= CREDITS ================= */
let creditSearch = '';
function renderCredits(){
  const main = document.getElementById('main');
  const q = norm(creditSearch);
  const list = state.credits.filter(c=>norm(c.name).includes(q)).sort((a,b)=>b.balance-a.balance);
  const totalDue = state.credits.reduce((a,c)=>a+c.balance,0);

  let rows = '';
  if(state.credits.length===0){
    rows = `<div class="empty"><div class="big">🤝</div><div class="msg">Aucun crédit pour l'instant.<br>Les ventes à crédit apparaîtront ici.</div></div>`;
  } else if(list.length===0){
    rows = `<div class="empty"><div class="msg">Aucun résultat pour « ${creditSearch} ».</div></div>`;
  } else {
    rows = '<div class="card" style="padding:0;">' + list.map(c=>`
      <div class="ledger-row" onclick="openClientModal('${c.id}')" style="cursor:pointer;">
        <div class="row-main">
          <div class="row-title">${escapeHtml(c.name)}</div>
          <div class="row-sub">${c.history.length} mouvement${c.history.length>1?'s':''}</div>
        </div>
        <div class="row-right">
          <span class="badge ${c.balance>0?'low':''}">${c.balance>0?money(c.balance):'Soldé'}</span>
        </div>
      </div>`).join('') + '</div>';
  }

  main.innerHTML = `
    <div class="summary-tile" style="margin-bottom:12px;">
      <div class="lbl">Total dû par les clients</div>
      <div class="val">${money(totalDue)}</div>
    </div>
    <div class="search-wrap">
      <span class="icon">🔍</span>
      <input type="text" id="creditSearchInput" placeholder="Chercher un client..." value="${escapeHtml(creditSearch)}" oninput="creditSearch=this.value; renderCredits(); refocusSearch('creditSearchInput');">
    </div>
    ${rows}
    <div style="height:8px;"></div>
    <button class="btn btn-primary" onclick="openAddCreditModal()">+ Enregistrer un crédit</button>
  `;
}

function openAddCreditModal(){
  openModal(`
    <div class="modal-handle"></div>
    <h3>Enregistrer un crédit</h3>
    <div class="search-wrap"><span class="icon">🔍</span>
      <input type="text" placeholder="Chercher ou taper un nouveau nom..." oninput="renderPersonPicker('addCreditPickerList', this.value, pickClientForManualCredit, createClientForManualCredit)">

    <div id="addCreditPickerList"></div>
